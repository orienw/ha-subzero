[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
# A test that waits on the integration must fail, not hang the run.
timeout = 60

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".private", ".research", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
