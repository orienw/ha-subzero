name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum in hacs.json and the latest release.
        include:
          - homeassistant: '2026.8.0'
            test-package: pytest-homeassistant-custom-component==0.13.354
          - homeassistant: '2026.11.0'
            test-package: pytest-homeassistant==2026.11.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt "homeassistant==${{ matrix.homeassistant }}" "${{ matrix.test-package }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
